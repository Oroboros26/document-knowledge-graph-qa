<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#0f766e"/>
    </marker>
    <filter id="s" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1240" height="700" fill="#f8fafc"/>
  <text x="620" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">doc-knowledge-graph: from documents to a queryable, provenance-tracked graph</text>

  <!-- lane labels -->
  <text x="30" y="82" font-size="13" font-weight="700" fill="#64748b" letter-spacing="1.5">1 · INGEST (Airflow DAG)</text>
  <rect x="20" y="92" width="1200" height="150" rx="12" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="30" y="282" font-size="13" font-weight="700" fill="#64748b" letter-spacing="1.5">2 · GRAPH STORE</text>
  <rect x="20" y="292" width="1200" height="120" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="30" y="452" font-size="13" font-weight="700" fill="#64748b" letter-spacing="1.5">3 · QUERY + ANSWER</text>
  <rect x="20" y="462" width="1200" height="160" rx="12" fill="#fff7ed" stroke="#fed7aa"/>

  <!-- lane 1 -->
  <g filter="url(#s)" font-size="13" text-anchor="middle" fill="#0f172a">
    <rect x="40" y="120" width="150" height="90" rx="10" fill="#fff" stroke="#6366f1"/>
    <text x="115" y="148" font-weight="700">Source docs</text>
    <text x="115" y="168">PDF · DOCX · MD</text>
    <text x="115" y="187" fill="#64748b">(documents to ingest)</text>

    <rect x="240" y="120" width="150" height="90" rx="10" fill="#fff" stroke="#6366f1"/>
    <text x="315" y="148" font-weight="700">Parse + chunk</text>
    <text x="315" y="168">doc_id · page · chunk_id</text>
    <text x="315" y="187" fill="#64748b">~400 tokens, overlap 50</text>

    <rect x="440" y="120" width="170" height="90" rx="10" fill="#fff" stroke="#6366f1"/>
    <text x="525" y="148" font-weight="700">LLM extraction</text>
    <text x="525" y="168">fixed Pydantic schema</text>
    <text x="525" y="187" fill="#64748b">temp 0 · retry on invalid</text>

    <rect x="660" y="120" width="170" height="90" rx="10" fill="#fff" stroke="#6366f1"/>
    <text x="745" y="148" font-weight="700">Entity resolution</text>
    <text x="745" y="168">normalise → embed → merge</text>
    <text x="745" y="187" fill="#64748b">alias list kept on node</text>

    <rect x="880" y="120" width="150" height="90" rx="10" fill="#fff" stroke="#6366f1"/>
    <text x="955" y="148" font-weight="700">Embed chunks</text>
    <text x="955" y="168">vector per chunk</text>
    <text x="955" y="187" fill="#64748b">for the RAG baseline</text>

    <rect x="1060" y="120" width="140" height="90" rx="10" fill="#fff" stroke="#6366f1"/>
    <text x="1130" y="148" font-weight="700">Idempotent load</text>
    <text x="1130" y="168">MERGE by key</text>
    <text x="1130" y="187" fill="#64748b">safe to re-run</text>
  </g>
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M190 165H236"/><path d="M390 165H436"/><path d="M610 165H656"/><path d="M830 165H876"/><path d="M1030 165H1056"/>
  </g>

  <!-- lane 2 -->
  <g filter="url(#s)" font-size="13" text-anchor="middle" fill="#0f172a">
    <rect x="60" y="316" width="330" height="76" rx="10" fill="#fff" stroke="#0f766e"/>
    <text x="225" y="342" font-weight="700">Neo4j property graph</text>
    <text x="225" y="362">(:Entity {id, name, type, aliases})</text>
    <text x="225" y="380" fill="#64748b">-[:REL {type, doc, page, chunk_id, conf}]-&gt;</text>

    <rect x="440" y="316" width="330" height="76" rx="10" fill="#fff" stroke="#0f766e"/>
    <text x="605" y="342" font-weight="700">(:Chunk) nodes + vector index</text>
    <text x="605" y="362">text · embedding · doc · page</text>
    <text x="605" y="380" fill="#64748b">(:Entity)-[:MENTIONED_IN]-&gt;(:Chunk)</text>

    <rect x="820" y="316" width="360" height="76" rx="10" fill="#fff" stroke="#0f766e"/>
    <text x="1000" y="342" font-weight="700">Provenance invariant</text>
    <text x="1000" y="362">every edge carries doc + page + chunk_id</text>
    <text x="1000" y="380" fill="#64748b">load rejects edges without it</text>
  </g>
  <path d="M1130 212V250H225V312" stroke="#0f766e" stroke-width="2" fill="none" marker-end="url(#g)"/>
  <path d="M955 212V268H605V312" stroke="#0f766e" stroke-width="2" fill="none" marker-end="url(#g)"/>

  <!-- lane 3 -->
  <g filter="url(#s)" font-size="13" text-anchor="middle" fill="#0f172a">
    <rect x="40" y="490" width="140" height="110" rx="10" fill="#fff" stroke="#ea580c"/>
    <text x="110" y="522" font-weight="700">User question</text>
    <text x="110" y="544">"Which products are</text>
    <text x="110" y="562">affected by finding</text>
    <text x="110" y="580">F-12?"</text>

    <rect x="230" y="480" width="200" height="60" rx="10" fill="#fff" stroke="#ea580c"/>
    <text x="330" y="505" font-weight="700">NL → Cypher</text>
    <text x="330" y="524" fill="#64748b">schema-in-prompt, few-shot</text>
    <rect x="230" y="550" width="200" height="60" rx="10" fill="#fff" stroke="#dc2626"/>
    <text x="330" y="575" font-weight="700">Cypher validator</text>
    <text x="330" y="594" fill="#64748b">read-only · labels · EXPLAIN</text>

    <rect x="480" y="480" width="200" height="60" rx="10" fill="#fff" stroke="#ea580c"/>
    <text x="580" y="505" font-weight="700">Graph RAG</text>
    <text x="580" y="524" fill="#64748b">seed entities → 2-hop expand</text>
    <rect x="480" y="550" width="200" height="60" rx="10" fill="#fff" stroke="#94a3b8"/>
    <text x="580" y="575" font-weight="700">Plain vector RAG</text>
    <text x="580" y="594" fill="#64748b">top-k chunks (baseline)</text>

    <rect x="730" y="510" width="190" height="70" rx="10" fill="#fff" stroke="#ea580c"/>
    <text x="825" y="538" font-weight="700">Answer LLM</text>
    <text x="825" y="558">cites chunk_id per claim</text>

    <rect x="970" y="480" width="230" height="60" rx="10" fill="#fff" stroke="#ea580c"/>
    <text x="1085" y="505" font-weight="700">Streamlit UI</text>
    <text x="1085" y="524" fill="#64748b">graph view (pyvis) · answer</text>
    <rect x="970" y="550" width="230" height="60" rx="10" fill="#fff" stroke="#7c3aed"/>
    <text x="1085" y="575" font-weight="700">Eval runner</text>
    <text x="1085" y="594" fill="#64748b">P/R · ER acc · multi-hop acc</text>
  </g>
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M180 545H206V510H226"/><path d="M180 545H206V580H226"/>
    <path d="M430 510H476"/><path d="M430 580H476" stroke-dasharray="4 3"/>
    <path d="M680 510H706V530H726"/><path d="M680 580H706V560H726"/>
    <path d="M920 545H946V510H966"/><path d="M920 545H946V580H966"/>
  </g>
  <!-- store -> query -->
  <path d="M225 394V440H330V476" stroke="#0f766e" stroke-width="2" fill="none" marker-end="url(#g)" stroke-dasharray="6 3"/>
  <path d="M605 394V470" stroke="#0f766e" stroke-width="2" fill="none" marker-end="url(#g)" stroke-dasharray="6 3"/>

  <!-- legend -->
  <g font-size="12" fill="#475569">
    <line x1="40" y1="660" x2="80" y2="660" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><text x="90" y="664">data flow</text>
    <line x1="190" y1="660" x2="230" y2="660" stroke="#0f766e" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#g)"/><text x="240" y="664">read from graph</text>
    <rect x="370" y="652" width="14" height="14" rx="3" fill="#fff" stroke="#dc2626"/><text x="392" y="664">safety gate</text>
    <rect x="480" y="652" width="14" height="14" rx="3" fill="#fff" stroke="#94a3b8"/><text x="502" y="664">baseline for comparison</text>
    <text x="1200" y="664" text-anchor="end">Target design: only the schema, entity resolution and the Cypher guard are implemented.</text>
  </g>
</svg>
